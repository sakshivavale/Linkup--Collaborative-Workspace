version: '3.8'

# US-SEC-03 (NFR-1.3): Sandboxed Code Execution
# Production Deployment Architecture:
# - Caddy handles incoming public internet traffic (HTTPS on 443, HTTP on 80).
# - LinkUp Server (Express + Socket.IO) runs on internal-net.
# - Piston runs in Docker with --privileged on internal-net ONLY.
# - PISTON IS NEVER REACHABLE FROM THE PUBLIC INTERNET. It has NO host port bindings.

services:
  caddy:
    image: caddy:2-alpine
    container_name: linkup-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    networks:
      - internal-net

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    container_name: linkup-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - PISTON_URL=http://piston:2000
    expose:
      - "3001"
    depends_on:
      - piston
    networks:
      - internal-net

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: linkup-piston-prod
    privileged: true
    restart: unless-stopped
    # CRITICAL SECURITY REQUIREMENT (US-SEC-03 AC-3):
    # Notice NO `ports` section is declared here.
    # Piston is strictly unexposed to host/public internet and only reachable via internal Docker network.
    expose:
      - "2000"
    tmpfs:
      - /tmp:exec
    environment:
      - PISTON_BIND_ADDRESS=0.0.0.0:2000
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge
    # internal bridge ensures communication between containers while only Caddy binds external host ports

volumes:
  caddy_data:
  caddy_config:
